global:
  scrape_interval: 10s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 15d
      size: 3GB

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: windows-codex
    scrape_interval: 2s
    scrape_timeout: 1s
    static_configs:
      - targets: ['textfile-exporter:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'codex_host_.*|node_textfile_scrape_error'
        action: keep
  - job_name: codex-otlp
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
  - job_name: observability
    static_configs:
      - targets: ['prometheus:9090', 'loki:3100', 'tempo:3200']
