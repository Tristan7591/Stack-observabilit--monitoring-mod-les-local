name: codex-observability

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  grafana:
    <<: *defaults
    image: grafana/grafana:12.4.16@sha256:982fa6bf18cc38280a30bf08c3b673486067d4805b25a9d4756688a689a993c7
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    <<: *defaults
    networks: [default, advisor-net]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yaml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    <<: *defaults
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    command: [--config=/etc/otelcol-contrib/config.yaml]
    ports:
      - '127.0.0.1:4318:4318'
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    mem_limit: 512m
    depends_on:
      - loki
      - tempo

  loki:
    <<: *defaults
    networks: [default, advisor-net]
    image: grafana/loki:3.6.22@sha256:4cf4ceb20e88b0543c88b541a71797c22a46eade04dd588dcdebf9f2b9c36063
    command: [-config.file=/etc/loki/local-config.yaml]
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  tempo:
    <<: *defaults
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    command: [-target=all, -config.file=/etc/tempo.yaml]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  textfile-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.13.1@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/host-metrics
    volumes:
      - type: bind
        source: '${CODEX_OBSERVABILITY_RUNTIME_DIR:-${LOCALAPPDATA:-.}/CodexObservability}/metrics'
        target: /host-metrics
        read_only: true
        bind:
          create_host_path: false

  advisor:
    <<: *defaults
    profiles: [advisor]
    image: codex-observability-advisor:local
    build:
      context: ./advisor
      network: none
    environment:
      ADVISOR_INTERVAL_SECONDS: '${ADVISOR_INTERVAL_SECONDS:-300}'
      ADVISOR_WINDOW_MINUTES: '${ADVISOR_WINDOW_MINUTES:-30}'
    networks: [advisor-net]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    volumes:
      - advisor-reports:/reports

networks:
  default: {}
  advisor-net:
    internal: true

secrets:
  grafana_admin_password:
    file: '${CODEX_OBSERVABILITY_RUNTIME_DIR:-${LOCALAPPDATA:-.}/CodexObservability}/grafana-admin-password.txt'

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:
  advisor-reports:
